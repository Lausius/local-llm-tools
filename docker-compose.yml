services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"   # optional: exposes Ollama to your host too, e.g. for `ollama run` from outside Docker
    volumes:
      - ollama_data:/root/.ollama   # persists downloaded models across container restarts/rebuilds
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  bot:
    build: .
    container_name: discord-mistral-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside Docker's network, containers reach each other by service name,
      # not localhost -- this overrides whatever OLLAMA_URL is in .env.
      - OLLAMA_URL=http://ollama:11434/api/generate
      # Containers default to UTC regardless of host timezone. Without this,
      # scheduled times (e.g. !schedule add ... at 08:00) would be
      # interpreted in UTC, not your local time.
      - TZ=Europe/Copenhagen
    volumes:
      # Bind mount (not a named volume) so the data files are visible and
      # editable directly on your filesystem, in ./data next to this compose
      # file -- not hidden inside Docker's internal volume storage.
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data: